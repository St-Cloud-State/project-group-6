{% extends "base.html" %}
{% block content %}
<h2>Assign Grades</h2>
<form method="POST">
    <div class="mb-3">
        <label for="registration_id" class="form-label">Select Student & Section</label>
        <select name="registration_id" class="form-select" required>
            {% for r in registrations %}
                <option value="{{ r[0] }}">
                    {{ r[1] }} - {{ r[2] }} | Section: {{ r[3] }} ({{ r[4] }}) - {{ r[5] }} {{ r[6] }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="grade" class="form-label">Grade</label>
        <input type="text" class="form-control" name="grade" placeholder="e.g. A, B+, C-" required>
    </div>
    <button type="submit" class="btn btn-success">Submit Grade</button>
</form>
{% endblock %}
